[provider]
default = "openai-codex"

[providers.openai-codex]
model = "gpt-5.5"
reasoning_effort = "medium"
sandbox = "workspace-write"
workdir = "."
full_auto = false
extra_args = []

[orison]
data_dir = ".orison"

[channels]
default = "local"
core_url = "http://127.0.0.1:8765"
http_addr = "127.0.0.1:8787"

[channels.qq]
ws_url = "ws://127.0.0.1:3001"
token = ""
# Comma-separated QQ user IDs allowed to talk to Orison. Use "*" only for trusted/private NapCat setups.
allow_from = "YOUR_QQ_ID"
share_session_in_channel = false
